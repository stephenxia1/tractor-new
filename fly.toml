# Fly.io app config for the @tractor/ws server.
# Replace `app` with your chosen Fly app name (must be globally unique)
# and `primary_region` with a region close to you (`fly platform regions`).

app = "tractor-ws-stephenxia"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  # Comma-separated list of allowed browser origins. Leave unset during
  # local testing; set to your Vercel domain(s) in production.
  # ALLOWED_ORIGINS = "https://your-app.vercel.app"
  # Cumulative results (apps/ws/src/results.ts): one JSON line per
  # finished hand at a table with a human, on the volume below.
  RESULTS_PATH = "/data/results.jsonl"

# A persistent disk for the results file, made once with
#   fly volumes create tractor_data --region sjc --size 1
# (HOSTING.md §1.5).
[mounts]
  source = "tractor_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  # 512 since rl-zero: its play network holds 44 MB of float32 weights,
  # and a local all-Zero table took the server process from 116 MB idle
  # to 193 MB, beside npm's own ~58 MB -- too close to 256.
  memory_mb = 512
