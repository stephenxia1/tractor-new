# Fly.io app config for the @tractor/ws server.
# Replace `app` with your chosen Fly app name (must be globally unique)
# and `primary_region` with a region close to you (`fly platform regions`).

app = "tractor-ws-stephenxia"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  # Comma-separated list of allowed browser origins. Leave unset during
  # local testing; set to your Vercel domain(s) in production.
  # ALLOWED_ORIGINS = "https://your-app.vercel.app"
  # Cumulative results (apps/ws/src/results.ts): one JSON line per
  # finished hand at a table with a human, on the volume below.
  RESULTS_PATH = "/data/results.jsonl"

# A persistent disk for the results file, made once with
#   fly volumes create tractor_data --region sjc --size 1
# (HOSTING.md §1.5).
[mounts]
  source = "tractor_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  # A dedicated CPU since 2026-11-25. On shared-cpu-1x the rl-zero bots
  # ran out of the shared CPU's burst credit in play, and the host held the
  # machine to its baseline (steal ~48% of user time). /health then missed
  # its 5 s timeout for minutes at a time, and Fly's proxy turned /ws and
  # /stats away ("could not find a good candidate"). performance-1x has no
  # credit to run out of. This block wins over `fly scale vm` at the next
  # deploy, so change the size here.
  cpu_kind = "performance"
  cpus = 1
  # performance-1x comes with 2 GB, its smallest size. 512 MB was enough:
  # rl-zero's play network holds 44 MB of float32 weights, and a local
  # all-Zero table took the server process from 116 MB idle to 193 MB.
  memory_mb = 2048
